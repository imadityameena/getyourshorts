name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install package
        # The heavy ML stack (Whisper, MediaPipe) is imported lazily and mocked in tests.
        run: pip install -e ".[dev]" opencv-python-headless
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type-check
        run: mypy app
      - name: Unit tests (≥70% coverage on selection logic)
        run: pytest -m "not integration" --cov=app.pipeline.select --cov-fail-under=70
      - name: Integration test (full pipeline on a 2-min sample)
        run: pytest -m integration

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest --run
      - run: npm run build
