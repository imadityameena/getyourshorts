# CPU stack:  docker compose up -d --build
# GPU stack:  docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
x-backend: &backend
  build:
    context: ./backend
    target: base
  image: shorts-backend:latest
  env_file: .env
  user: "${UID:-1000}:${GID:-1000}"     # files in ./storage stay owned by you, not root
  environment:
    STORAGE_DIR: /data
    HOME: /tmp
  volumes:
    - ./storage:/data
  extra_hosts:
    - "host.docker.internal:host-gateway"   # reach Ollama running on the host
  restart: unless-stopped

services:
  api:
    <<: *backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    <<: *backend
    command: huey_consumer app.worker.tasks.huey -w 1 -k thread
    environment:
      STORAGE_DIR: /data
      HOME: /tmp
      USE_GPU: "false"
